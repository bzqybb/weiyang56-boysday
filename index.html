<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a0f2b">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="未央书院56班男生节专属祝福领取页。输入姓名，拆开属于你的手绘贺图。">
  <meta property="og:title" content="未央56男生节 · 有一份祝福等你签收">
  <meta property="og:description" content="输入姓名，拆开属于你的那一张手绘贺图。">
  <meta property="og:type" content="website">
  <title>未央56男生节 · 有一份祝福等你签收</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/badge-seal.png" as="image">
  <link rel="stylesheet" href="styles.css">
  <script src="data/manifest.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <svg class="svg-sprite" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-ginkgo" viewBox="0 0 100 100">
        <path d="M50 92C48 78 45 70 40 63 26 56 12 48 12 37c0-12 14-19 26-13 5 2 9 6 12 14 3-8 7-12 12-14 12-6 26 1 26 13 0 11-14 19-28 26-5 7-8 15-10 29Z" fill="currentColor"/>
        <path d="M50 99V82" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
        <path d="M50 84 18 34M50 84l32-50M50 84 33 26M50 84l17-59M50 84 25 51M50 84l25-54" fill="none" stroke="currentColor" stroke-width="1" opacity=".26" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-gift" viewBox="0 0 24 24">
        <path d="M4 10h16v10H4zM3 7h18v3H3zM12 7v13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M12 7C10.7 4.4 9.6 3.4 8.1 3.7 6.3 4 6.1 6.6 8 7h4Zm0 0c1.3-2.6 2.4-3.6 3.9-3.3 1.8.3 2 2.9.1 3.3h-4Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24">
        <path d="M4 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-skip" viewBox="0 0 24 24">
        <path d="M5 6l8 6-8 6V6Zm9 0 6 6-6 6V6Z" fill="currentColor"/>
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24">
        <path d="M12 3v12m0 0 5-5m-5 5-5-5M4 20h16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-eye" viewBox="0 0 24 24">
        <path d="M2.5 12S6 5.7 12 5.7 21.5 12 21.5 12 18 18.3 12 18.3 2.5 12 2.5 12Z" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.6"/>
      </symbol>
      <symbol id="i-copy" viewBox="0 0 24 24">
        <rect x="8" y="8" width="11" height="12" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M16 8V5.6c0-.9-.7-1.6-1.6-1.6H5.6C4.7 4 4 4.7 4 5.6v10.8c0 .9.7 1.6 1.6 1.6H8" fill="none" stroke="currentColor" stroke-width="1.6"/>
      </symbol>
      <symbol id="i-replay" viewBox="0 0 24 24">
        <path d="M4.5 11a7.5 7.5 0 1 1 2 5.3M4.5 5.5V11H10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-back" viewBox="0 0 24 24">
        <path d="M20 12H5m6-6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    </defs>
  </svg>

  <div class="site-shell" id="siteShell">
    <div class="ambient" aria-hidden="true">
      <div class="ambient-glow ambient-glow-a"></div>
      <div class="ambient-glow ambient-glow-b"></div>
      <div class="ambient-grid"></div>
      <div class="ambient-leaves" id="homeLeaves"></div>
      <div class="ambient-grain"></div>
    </div>

    <main id="main">
      <section class="view gate" id="gate" aria-labelledby="gateTitle">
        <header class="topbar">
          <a class="brand-badge" href="index.html" aria-label="未央56首页">
            <img src="assets/badge-seal.png" alt="" width="192" height="192">
          </a>
          <span class="topbar-name">未央56</span>
        </header>

        <div class="hero">
          <p class="eyebrow"><span class="rule"></span>未央56男生节<span class="rule"></span></p>
          <h1 id="gateTitle">有一份祝福<br><em>等你签收</em></h1>
        </div>

        <div class="letter-wrap">
          <div class="letter">
            <div class="seal" aria-hidden="true"><span>56</span></div>
            <div class="letter-stamp-card" aria-hidden="true">
              <img src="assets/badge-seal.png" alt="" width="192" height="192">
            </div>

            <form id="claimForm" novalidate>
              <label class="field-label" for="nameInput">写下你的名字</label>
              <div class="name-control">
                <div class="field-row">
                  <input
                    id="nameInput"
                    name="name"
                    type="text"
                    inputmode="text"
                    autocomplete="name"
                    autocapitalize="off"
                    spellcheck="false"
                    placeholder="请输入姓名"
                    aria-describedby="nameError"
                    aria-autocomplete="list"
                    aria-controls="suggestPanel"
                    aria-expanded="false"
                  >
                  <span class="field-line" aria-hidden="true"></span>
                </div>

                <div class="suggest" id="suggestPanel" hidden>
                  <p class="suggest-hint" id="suggestHint">从名单中选择</p>
                  <div class="suggest-list" id="suggestList" role="listbox" aria-label="班级名单"></div>
                </div>
              </div>

              <p class="field-error" id="nameError" role="alert"></p>

              <button class="btn-open" id="openBtn" type="submit">
                <svg class="icon" aria-hidden="true"><use href="#i-gift"></use></svg>
                <span class="btn-open-label">拆开我的礼物</span>
                <svg class="icon icon-arrow" aria-hidden="true"><use href="#i-arrow"></use></svg>
              </button>
            </form>
          </div>
        </div>
      </section>

      <section class="view reveal" id="reveal" aria-labelledby="revealTitle" hidden>
        <header class="reveal-head">
          <button class="text-icon" id="changeBtn" type="button">
            <svg class="icon" aria-hidden="true"><use href="#i-back"></use></svg>
            换一位
          </button>
          <span class="reveal-brand">未央56 · 男生节</span>
          <button class="icon-btn" id="replayTop" type="button" aria-label="重播拆礼动画">
            <svg class="icon" aria-hidden="true"><use href="#i-replay"></use></svg>
          </button>
        </header>

        <div class="reveal-intro">
          <p class="eyebrow">TO · <span id="revealTo"></span></p>
          <h2 id="revealTitle">你的那一张，<br><em>已经拆开。</em></h2>
        </div>

        <figure class="card-figure">
          <div class="card-halo" aria-hidden="true"></div>
          <div class="card-shell" id="cardShell">
            <div class="card-shimmer" id="cardLoading" aria-hidden="true"></div>
            <img id="cardImage" alt="" decoding="async">
          </div>
          <figcaption>
            <span>手绘专属贺图</span>
            <span id="cardMeta"></span>
          </figcaption>
        </figure>

        <section class="note" aria-label="班级寄语">
          <span class="note-quote" aria-hidden="true">“</span>
          <p class="note-text" id="noteText">愿你有树可栖，有梦可追；<br>奔跑时乘风，回头时我们在。</p>
          <p class="note-sign">—— 未央56班 · 2026 男生节</p>
        </section>

        <div class="actions">
          <button class="btn btn-primary" id="downloadBtn" type="button">
            <svg class="icon" aria-hidden="true"><use href="#i-download"></use></svg>
            <span id="downloadLabel">下载原图</span>
          </button>
          <div class="actions-sub">
            <button class="btn btn-ghost" id="viewBtn" type="button">
              <svg class="icon" aria-hidden="true"><use href="#i-eye"></use></svg>
              查看大图
            </button>
            <button class="btn btn-ghost" id="copyBtn" type="button">
              <svg class="icon" aria-hidden="true"><use href="#i-copy"></use></svg>
              复制祝福
            </button>
          </div>
          <p class="file-meta" id="fileMeta"></p>
        </div>

        <div class="reveal-foot">
          <button class="text-btn" id="replayBtn" type="button">
            <svg class="icon" aria-hidden="true"><use href="#i-replay"></use></svg>
            再看一次拆礼
          </button>
          <span class="dot" aria-hidden="true"></span>
          <button class="text-btn" id="changeBtn2" type="button">换一个人领取</button>
        </div>

        <p class="closing-line">每一张，都是有人认真画给你的。</p>
      </section>
    </main>
  </div>

  <div class="opening" id="opening" hidden aria-label="拆礼物动画">
    <div class="opening-bg" aria-hidden="true">
      <div class="opening-aurora"></div>
      <div class="opening-glow"></div>
      <div class="leaf-field" id="leafField"></div>
      <div class="opening-grain"></div>
    </div>

    <div class="opening-head">
      <span>未央56 · 男生节</span>
      <button class="skip-btn" id="skipBtn" type="button">
        跳过
        <svg class="icon" aria-hidden="true"><use href="#i-skip"></use></svg>
      </button>
    </div>

    <div class="opening-stage">
      <div class="stage-halo" aria-hidden="true"></div>

      <div class="gift" id="gift">
        <div class="envelope" id="envelope">
          <div class="letter" id="letter">
            <div class="letter-stamp" aria-hidden="true">
              <img src="assets/badge-seal.png" alt="" width="192" height="192">
            </div>
            <div class="letter-script" aria-hidden="true">
              <span>未央书院</span>
              <strong>56</strong>
              <span>男生节</span>
            </div>
            <div class="letter-lines" aria-hidden="true"><i></i><i></i><i></i></div>
          </div>
          <div class="env-pocket" aria-hidden="true"></div>
          <div class="env-flap" aria-hidden="true"></div>
          <div class="env-seal" aria-hidden="true"><span>56</span></div>
        </div>

        <div class="wish-reveal" id="wishReveal">
          <p class="wish-to">TO · <span id="animTo"></span></p>
          <h2 id="animWish"><span id="animName"></span>，<br><em>男生节快乐！</em></h2>
        </div>
      </div>

      <div class="gold-burst" aria-hidden="true"></div>
    </div>

    <div class="opening-foot">
      <p>正在拆开你的礼物</p>
      <div class="progress-track" aria-hidden="true"><span></span></div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="查看大图" hidden>
    <button class="lightbox-close" id="lightboxClose" type="button" aria-label="关闭大图">
      <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
    </button>
    <div class="lightbox-scroll" id="lightboxScroll">
      <img id="lightboxImg" alt="">
    </div>
    <div class="lightbox-loader" id="lightboxLoader">高清原图加载中…</div>
    <div class="lightbox-bar">
      <span>双指放大 · 点击空白处关闭</span>
      <button class="lightbox-download" id="lightboxDownload" type="button">下载原图</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript">这个页面需要开启 JavaScript 才能拆开祝福。</div>
  </noscript>
</body>
</html>
